<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер Pomodoro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="timer-panel">
        <div class="top-line">
          <div>
            <h1>Таймер Pomodoro</h1>
          </div>
          <span id="modeBadge" class="badge">Работа</span>
        </div>

        <div class="clock-box">
          <p id="roundText" class="round-text">Интервал 1</p>
          <div id="timeText" class="time">25:00</div>
          <progress id="progressBar" value="0" max="100"></progress>
        </div>

        <div class="buttons">
          <button id="startPauseBtn" class="primary">Старт</button>
          <button id="resetBtn">Сброс</button>
        </div>

        <p id="messageText" class="message">Настройте интервалы и нажмите старт.</p>
      </section>

      <section class="side-panel">
        <div class="block">
          <h2>Интервалы</h2>
          <label>
            Работа, минут
            <input id="workInput" type="number" min="1" max="180" value="25" />
          </label>
          <label>
            Перерыв, минут
            <input id="breakInput" type="number" min="1" max="60" value="5" />
          </label>
          <label>
            Длинный перерыв, минут
            <input id="longBreakInput" type="number" min="1" max="90" value="15" />
          </label>
          <label>
            Рабочих интервалов до длинного перерыва
            <input id="roundsInput" type="number" min="1" max="12" value="4" />
          </label>
        </div>

        <div class="block">
          <h2>Музыка</h2>
          <div class="music-row">
            <button id="musicBtn">Включить</button>
            <label class="volume">
              Громкость
              <input id="volumeInput" type="range" min="0" max="100" value="25" />
            </label>
          </div>
          <audio id="musicAudio" src="music/Journey(chosic.com).mp3" loop></audio>
        </div>

        <div class="block">
          <h2>Статистика</h2>
          <div class="stats">
            <div>
              <span id="doneText">0</span>
              <p>помидоров</p>
            </div>
            <div>
              <span id="minutesText">0</span>
              <p>минут работы</p>
            </div>
            <div>
              <span id="breaksText">0</span>
              <p>перерывов</p>
            </div>
          </div>
          <button id="clearStatsBtn" class="danger">Очистить статистику</button>
        </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
